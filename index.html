<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>イベントカレンダー</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1f1633;--mut:#7b7391;--pk:#d6458f;--pk2:#fbeef5;--vi:#6d3fd1;--vi2:#f4f0ff;--bg:#faf8fc;--line:#ece6f5;--gr:#f6f5f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:calc(96px + env(safe-area-inset-bottom,0))}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
a{color:var(--vi);word-break:break-all}
:focus-visible{outline:3px solid var(--vi);outline-offset:2px}

/* ヘッダー周り（左右配置） */
.hero{height:160px;background:linear-gradient(135deg,#2a1559 0%,#6d3fd1 55%,#d6458f 120%);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:16px;background-size:cover;background-position:center}
.genre-bar{display:flex;gap:6px}
.genre-bar button{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.genre-bar button.active{background:#fff;color:var(--vi);border-color:#fff}

/* 右側配置の整理 */
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.year-select{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);color:#fff;font-weight:700;font-size:12px;padding:4px 8px;border-radius:8px;width:auto;cursor:pointer}
.year-select option{color:var(--ink);background:#fff}

/* 最下段の横並びエリア */
.hero-bottom-row{display:flex;align-items:center;gap:6px}

/* infoボタンと未読赤丸バッジ */
.info-btn-wrap{position:relative;display:inline-block}
.info-btn{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);color:#fff;font-weight:700;font-size:12px;padding:6px 12px;border-radius:99px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.unread-badge{position:absolute;top:-4px;left:-4px;background:#e74c3c;color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid #fff;line-height:1;box-shadow:0 2px 4px rgba(0,0,0,.2)}

.setting-btn{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);color:#fff;font-weight:700;font-size:12px;padding:4px 10px;border-radius:8px;cursor:pointer}

.me{display:flex;align-items:center;gap:6px;font-size:12px}
.me button{background:rgba(255,255,255,.2);padding:6px 12px;border-radius:99px;font-size:12px;color:#fff;font-weight:700}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2)!important;padding:4px 10px!important;white-space:nowrap}
.chip .av{margin:0;width:22px;height:22px;font-size:11px}

/* カレンダーグリッド */
.cal{position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);z-index:4;background:var(--bg);margin:-14px -14px 10px;padding:6px 14px 8px;border-bottom:1px solid var(--line)}
.calh{display:flex;justify-content:space-between;align-items:center}
.calh b{font-size:16px}
.calh button{width:44px;height:32px;font-size:24px;color:var(--vi)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}
.wd{font-size:11px;color:var(--mut);padding:2px 0}
.dc{position:relative;min-height:48px;font-size:13px;font-weight:700;border-radius:8px;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding-top:3px;overflow:hidden;background:#fff;border:1px solid transparent}
.su{color:#d33}.sa{color:#2a6ad8}
.dc.today{background:var(--pk2);color:var(--pk);font-weight:900}
.dc.sel{outline:2px solid var(--vi);z-index:1}

/* カレンダー内のラベルバッジ */
.cal-badges{display:flex;flex-direction:column;gap:2px;width:100%;padding:2px 1px 1px;margin-top:auto}
.cbadge{display:block;width:100%;font-size:9px;font-weight:700;color:#fff;padding:1px 2px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;text-align:center}
.cbadge.music{background:#4a90e2}
.cbadge.comedy{background:#f5a623}

.flt{display:flex;justify-content:space-between;align-items:center;background:var(--vi2);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.tabs{position:sticky;top:env(safe-area-inset-top,0);z-index:5;display:flex;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:48px;padding:0;font-weight:700;color:var(--mut);border-bottom:3px solid transparent}
.tabs button.on{color:var(--pk);border-color:var(--pk)}
.wrap{padding:14px 14px 0;max-width:640px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;gap:8px}
.bar select{width:auto;padding:6px 10px}

/* アラートバッジ */
.deadline-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-top:4px}
.deadline-badge.yellow{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.deadline-badge.red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}

/* NEWバッジ */
.new-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--pk);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;line-height:1;letter-spacing:0.5px;flex-shrink:0}

/* ポップアップ用閉じるボタン */
.modal-close-btn{position:absolute;top:12px;right:14px;font-size:22px;color:var(--mut);cursor:pointer;padding:4px 8px;line-height:1}

/* スワイプアクション */
.swipe-wrap{position:relative;overflow:hidden;border-radius:18px;margin-bottom:14px;background:#95a5a6}
.swipe-wrap.is-hid{background:var(--vi)}
.swipe-action{position:absolute;right:0;top:0;bottom:0;width:100px;background:#95a5a6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;z-index:1;cursor:pointer}
.swipe-wrap.is-hid .swipe-action{background:var(--vi)}

.card{position:relative;z-index:2;background:#fff;border-radius:18px;padding:16px;margin-bottom:0;box-shadow:0 2px 14px rgba(70,40,120,.07);transition:transform 0.25s ease}
.card.swiped{transform:translateX(-100px)}
.card.hid{background:#f0edf6;color:#8e83a6}
.card.hid .mut{color:#aba2be}
.card.hid b{color:#8e83a6!important}
.card.past{background:#e8e5ed;color:#6d6380}
.card.past .mut{color:#8b80a1}
.card.past b{color:#6d6380!important}

.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.grow{flex:1;min-width:0}
h3{margin:0;font-size:19px;font-weight:800;line-height:1.3;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mut{color:var(--mut);margin:2px 0 0;font-size:14px}
.th{width:64px;height:64px;border-radius:14px;object-fit:cover;border:1px solid var(--line);flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.b{border-radius:12px;padding:8px 10px;background:var(--gr)}
.b small{display:block;font-size:11px;color:var(--mut)}
.b b{font-size:12.5px}
.b.pk{background:var(--pk2)}.b.pk b{color:#8c1d58}
.b.vi{background:var(--vi2)}.b.vi b{color:#47208f}
.wide{grid-column:1/-1}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.hint{color:var(--pk);font-size:13px;font-weight:700}
.go{background:var(--pk);color:#fff;font-weight:800;padding:9px 16px;border-radius:99px}
.go.on{background:var(--vi)}
.avs{display:flex;align-items:center;margin-top:10px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--vi);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;margin-right:-8px;flex:none}
.avs span.n{margin-left:16px;font-size:12px;color:var(--mut)}

/* 管理者アクションボタン（右下固定） */
.admin-actions{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:12px;z-index:6}
.fab{width:58px;height:58px;border-radius:50%;background:var(--pk);color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(214,69,143,.45);display:flex;align-items:center;justify-content:center}
.fab-mail{width:50px;height:50px;border-radius:50%;background:var(--vi);color:#fff;font-size:22px;box-shadow:0 4px 14px rgba(109,63,209,.4);display:flex;align-items:center;justify-content:center;align-self:center}

.num{display:flex;justify-content:space-between;align-items:center;gap:12px;touch-action:pan-y}
.nb{min-width:92px;text-align:center;border:1.5px solid #dccdf8;background:var(--vi2);border-radius:14px;padding:8px 10px;cursor:pointer}
.nb:active{background:#e9dffc}
.nb small{display:block;font-size:11px;color:var(--vi)}
.nb b{font-size:22px;color:#3b1a82}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.mask{position:fixed;inset:0;background:rgba(20,10,40,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{position:relative;background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0))}
.sheet img.big{width:100%;border-radius:14px;margin-bottom:12px}
.sec{border-radius:14px;padding:12px 14px;margin:12px 0}
.sec h4{margin:0 0 6px;font-size:14px}
.sec p{margin:3px 0}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;margin-top:10px;text-align:center}
.btn.p{background:var(--pk);color:#fff;border-color:var(--pk)}
.btn.d{color:#c0392b}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.auth{max-width:420px;margin:0 auto;padding:28px 18px}
.auth h2{font-size:24px;margin:0 0 4px}
.who{display:flex;align-items:center;gap:8px;margin:6px 0}
.who .av{margin:0;border:0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:30;display:none}

/* info一覧用デザイン（点線区切り） */
.info-item{padding:14px 0;border-bottom:1px dotted var(--mut)}
.info-item:last-child{border-bottom:none}
.info-date{font-size:13px;font-weight:700;color:var(--mut);margin-bottom:4px}
.info-body{font-size:14px;color:var(--ink);white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
const sb = supabase.createClient('https://njzdxjkclaonvtjirrgp.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qemR4amtjbGFvbnZ0amlycmdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MzY2NjQsImV4cCI6MjEwODAxMjY2NH0.KkV71ATa8YGN33XJgLtmzJTlsHQkmhoqEAg3bO-wX9U');
let calY=new Date().getFullYear(),calM=new Date().getMonth(),selDate=null,siteSettingsMap={},me=null,prof=null,lives=[],ints=[],profs={},nums={},announcements=[],tab='s',sort='d',showHid=false,authMode='in',tx=0,isMoved=false,activeSwipeId=null,currentGenre='live',selYear='ALL';
let currentTouchTarget=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//.test(u||'')?esc(u):'';
const link=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
const p2=n=>String(n).padStart(2,'0');
const getTodayStr=()=>{const t=new Date();return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())};
const isPastDate=d=>d && d < getTodayStr();

// 作成日時から3日（72時間）以内かどうか判定する関数
const isNewEvent=createdAt=>{
 if(!createdAt) return false;
 const created = new Date(createdAt).getTime();
 const now = new Date().getTime();
 const diffHours = (now - created) / (1000 * 60 * 60);
 return diffHours >= 0 && diffHours <= 72; // 72時間以内ならtrue
};

const fd=d=>{if(!d)return'未定';const x=new Date(d+'T00:00:00');return x.getFullYear()+'年'+(x.getMonth()+1)+'月'+x.getDate()+'日('+'日月火水木金土'[x.getDay()]+')'};
const fdt=t=>{if(!t)return'—';const x=new Date(t);return (x.getMonth()+1)+'/'+x.getDate()+' '+p2(x.getHours())+':'+p2(x.getMinutes())};
const loc=t=>{if(!t)return'';const x=new Date(t);return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate())+'T'+p2(x.getHours())+':'+p2(x.getMinutes())};
const av=p=>p&&safe(p.icon_url)?'<img class="av" src="'+safe(p.icon_url)+'" alt="">':'<span class="av">'+esc(((p&&p.username)||'?').slice(0,1))+'</span>';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const closeM=()=>$('#mask').classList.remove('on');
const openM=h=>{$('#sheet').innerHTML=h;$('#mask').classList.add('on')};
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeM()});

// 未読件数の取得関数
function getUnreadInfoCount(){
 if(!announcements.length) return 0;
 const lastSeenId = localStorage.getItem('koyake_last_seen_info_id');
 if(!lastSeenId) return announcements.length;
 const idx = announcements.findIndex(a => a.id === lastSeenId);
 return idx === -1 ? announcements.length : idx;
}

// 申込締切の残り日数アラート判定
function getDeadlineAlert(applyEnd){
 if(!applyEnd)return null;
 const now=new Date();
 const end=new Date(applyEnd);
 const diffHours=(end-now)/(1000*60*60);
 if(diffHours<0 || diffHours>72)return null; // 3日(72時間)以内のみ対象
 
 const days=Math.ceil(diffHours/24);
 if(days<=1){
  return {text:'⚠️ 申込締切まで 残り1日', color:'red'};
 }else{
  return {text:`⚠️ 申込締切まで 残り${days}日`, color:'yellow'};
 }
}

// 初回起動時のポップアップチェック（お知らせ ＆ 締切アラート）
function checkInitialPopups(){
 // 1. お知らせの初回通知チェック
 if(announcements.length > 0){
  const latestInfo = announcements[0]; // 作成日時降順で一番新しいもの
  const storageKey = 'koyake_announcement_seen_' + latestInfo.id;
  if(!localStorage.getItem(storageKey)){
   openM(
    '<span class="modal-close-btn" onclick="dismissInfoAlert(\''+storageKey+'\')">&times;</span>' +
    '<h3 style="font-size:20px; color:var(--vi); margin-bottom:12px;">📢お知らせ📢</h3>' +
    '<div class="sec" style="background:var(--vi2); white-space:pre-wrap; font-size:15px; line-height:1.6;">' + link(latestInfo.body) + '</div>' +
    '<button class="btn p" onclick="dismissInfoAlert(\''+storageKey+'\')">閉じる</button>'
   );
   return; // お知らせが表示された場合は締切アラートは次回へ
  }
 }

 // 2. 締切アラートのチェック
 checkDailyDeadlineAlert();
}

function dismissInfoAlert(storageKey){
 localStorage.setItem(storageKey, 'true');
 closeM();
 setTimeout(checkDailyDeadlineAlert, 300);
}

function checkDailyDeadlineAlert(){
 const todayStr = getTodayStr();
 const storageKey = 'koyake_alert_dismissed_' + todayStr;
 if(localStorage.getItem(storageKey)) return;

 const urgentLives = lives.filter(l=>{
  const alert = getDeadlineAlert(l.apply_end);
  return alert !== null;
 });

 if(urgentLives.length === 0) return;

 const target = urgentLives.sort((a,b)=>new Date(a.apply_end)-new Date(b.apply_end))[0];
 const alertInfo = getDeadlineAlert(target.apply_end);
 const badgeClass = alertInfo.color === 'red' ? 'red' : 'yellow';

 openM(
  '<span class="modal-close-btn" onclick="dismissDailyAlert(\''+storageKey+'\')">&times;</span>' +
  '<h3 style="font-size:20px; color:var(--pk); margin-bottom:8px;">⚠️ 申込締切が迫っています！</h3>' +
  '<p class="mut">本日チェックすべき締切間近のイベントがあります。</p>' +
  '<div class="sec" style="background:var(--pk2)">' +
  '<h4>' + esc(target.title) + '</h4>' +
  '<p>申込締切: <b>' + fdt(target.apply_end) + '</b></p>' +
  '<div class="deadline-badge ' + badgeClass + '">' + alertInfo.text + '</div>' +
  '</div>' +
  '<button class="btn p" onclick="dismissDailyAlert(\''+storageKey+'\'); detail(\''+target.id+'\')">詳細を確認する</button>' +
  '<button class="btn" onclick="dismissDailyAlert(\''+storageKey+'\')">閉じる（今日はもう表示しない）</button>'
 );
}

function dismissDailyAlert(storageKey){
 localStorage.setItem(storageKey, 'true');
 closeM();
}

function authView(){
 const up=authMode==='up';
 $('#app').innerHTML='<div class="auth"><h2>カレンダーログイン</h2>'
 +(up?'<label>招待コード（合言葉）</label><input id="code" placeholder="幹事に確認してください">'
 +'<label>ユーザー名（みんなに表示されます）</label><input id="un" maxlength="20">':'')
 +'<label>メールアドレス</label><input id="em" type="email" autocomplete="email"><label>パスワード（6文字以上）</label><input id="pw" type="password" autocomplete="'+(up?'new-password':'current-password')+'">'
 +'<button class="btn p" onclick="doAuth()">'+(up?'登録する':'ログイン')+'</button>'
 +'<button class="btn" onclick="authMode=\''+(up?'in':'up')+'\';authView()">'+(up?'ログイン画面へ':'新しく登録する')+'</button></div>';
}
async function doAuth(){
 const email=$('#em').value.trim(),password=$('#pw').value;
 if(!email||!password)return toast('メールとパスワードを入力してください');
 let r;
 if(authMode==='up'){
  const code=$('#code').value.trim();
  if(!code)return toast('招待コードを入力してください');
  const check=await sb.from('invitation_codes').select('code').eq('code',code).maybeSingle();
  if(!check.data)return toast('招待コードが違います');
  const username=$('#un').value.trim()||'名無し';
  r=await sb.auth.signUp({email,password,options:{data:{username,icon_url:null}}});
  if(!r.error&&!r.data.session)return toast('確認メールを送信しました。メール内のリンクを開いてください');
 }else r=await sb.auth.signInWithPassword({email,password});
 if(r.error)toast('失敗: '+r.error.message);
}
async function load(){
 const q=await Promise.all([
  sb.from('lives').select('*'),
  sb.from('interests').select('*'),
  sb.from('profiles').select('*'),
  sb.from('my_numbers').select('*'),
  sb.from('site_settings').select('*'),
  sb.from('announcements').select('*').order('created_at',{ascending:false})
 ]);
 lives=q[0].data||[];
 ints=q[1].data||[];
 profs={};(q[2].data||[]).forEach(p=>profs[p.id]=p);
 nums={};(q[3].data||[]).forEach(n=>nums[n.live_id]=n);
 prof=profs[me.id]||{};
 announcements=q[5].data||[];
 
 siteSettingsMap={};
 (q[4].data||[]).forEach(s=>{ siteSettingsMap[s.genre||'live'] = s; });
 render();

 setTimeout(checkInitialPopups, 300);
}
function getActiveSite(){
 return siteSettingsMap[currentGenre] || {title:'', header_url:''};
}
function compareDateTime(a, b){
 const dComp = (a.live_date || '9999').localeCompare(b.live_date || '9999');
 if(dComp !== 0) return dComp;
 const tA = a.start_time || a.open_time || '99:99';
 const tB = b.start_time || b.open_time || '99:99';
 return tA.localeCompare(tB);
}
function filterByGenreAndYear(l){
 return l.filter(x=>{
  const gMatch = (currentGenre==='koyake') ? true : ((x.genre||'live')===currentGenre);
  if(!gMatch) return false;
  if(selYear !== 'ALL'){

function sorted(){

 l.sort((a,b)=>{
  const aPast = isPastDate(a.live_date);

 });
 return l;
}

function touchStart(e,id){
 tx=e.touches[0].clientX;
 isMoved=false;
 currentTouchTarget=e.currentTarget;
 currentTouchTarget.style.transition='none';
}
function touchMove(e,id){
 if(!currentTouchTarget)return;
 const currentX=e.touches[0].clientX;
 const diff=currentX-tx;
 if(Math.abs(diff)>10) isMoved=true;
 let moveX=Math.min(0,Math.max(-100,(activeSwipeId===id?-100:0)+diff));
 currentTouchTarget.style.transform=`translateX(${moveX}px)`;
}
function swipe(e,id){
 if(!currentTouchTarget)return;
 currentTouchTarget.style.transition='transform 0.25s ease';
 const diff=e.changedTouches[0].clientX-tx;
 if(activeSwipeId===id){
  if(diff>40)activeSwipeId=null;
 }else{
  if(diff<-40)activeSwipeId=id;
 }
 currentTouchTarget=null;
 if(isMoved){
  render();
 }
}
function handleNumBoxTap(e,id){
 e.stopPropagation();
 if(e.type==='touchend') e.preventDefault();
 if(isMoved) return;
 if(activeSwipeId===id){
  activeSwipeId=null;
  render();
 }else{
  numM(id);
 }
}

 const r=await sb.from('my_numbers').upsert({live_id:id,user_id:me.id,number:v});
 if(r.error)return toast('失敗: '+r.error.message);
 closeM();load();
}
function myPage(){
 openM('<h3>マイページ</h3><div class="who">'+av(prof)+'<b>'+esc(prof.username)+'</b></div>'
 +'<label>ユーザー名</label><input id="mu" maxlength="20" value="'+esc(prof.username)+'">'
 +'<label>プロフィール画像（タップして写真を選択）</label><input id="mfile" type="file" accept="image/*">'
 +'<button class="btn p" onclick="saveMe()">プロフィールを保存</button>'
 +'<label>メールアドレス</label><input id="me_" type="email" value="'+esc(me.email)+'">'
 +'<button class="btn" onclick="saveEmail()">メールアドレスを変更</button>'
 +'<label>新しいパスワード（6文字以上）</label><input id="np" type="password" autocomplete="new-password">'
 +'<button class="btn" onclick="savePw()">パスワードを変更</button>'
 +'<button class="btn d" onclick="closeM();sb.auth.signOut()">ログアウト</button><button class="btn" onclick="closeM()">閉じる</button>');
}
function resizeImg(file){
 return new Promise((res,rej)=>{
  const img=new Image(),reader=new FileReader();
  reader.onload=e=>img.src=e.target.result;
  reader.onerror=rej;
  img.onload=()=>{
   const canvas=document.createElement('canvas');
   let w=img.width,h=img.height,max=300;
   if(w>h){if(w>max){h=Math.round(h*max/w);w=max}}else{if(h>max){w=Math.round(w*max/h);h=max}}
   canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext('2d');
   ctx.drawImage(img,0,0,w,h);
   canvas.toBlob(b=>res(b),'image/jpeg',0.85);
  };
  reader.readAsDataURL(file);
 });
}
async function saveMe(){
 const username=$('#mu').value.trim()||'名無し';
 let icon_url=prof.icon_url||null;
 const fileInput=$('#mfile');
 if(fileInput.files&&fileInput.files[0]){
  toast('画像を圧縮してアップロード中...');
  try{
   const blob=await resizeImg(fileInput.files[0]);
   const path=me.id+'.jpg';
   const up=await sb.storage.from('avatars').upload(path,blob,{contentType:'image/jpeg',upsert:true});
   if(up.error)return toast('画像失敗: '+up.error.message);
   const pub=sb.storage.from('avatars').getPublicUrl(path);
   icon_url=pub.data.publicUrl+'?v='+Date.now();
  }catch(err){return toast('画像処理に失敗しました')}
 }
 const r=await sb.from('profiles').update({username,icon_url}).eq('id',me.id);
 if(r.error)return toast('失敗: '+r.error.message);
 closeM();toast('保存しました');load();
}
async function saveEmail(){
 const e=$('#me_').value.trim();
 if(!e||e===me.email)return toast('新しいメールアドレスを入力してください');
 const r=await sb.auth.updateUser({email:e});
 if(r.error)return toast('失敗: '+r.error.message);
 toast('変更しました。確認メールが届いた場合はリンクを開いてください');
}
async function savePw(){
 const p=$('#np').value;
 if(p.length<6)return toast('6文字以上で入力してください');
 const r=await sb.auth.updateUser({password:p});
 if(r.error)return toast('失敗: '+r.error.message);
 $('#np').value='';toast('パスワードを変更しました');
}
function siteM(){
 const genreNames = { live: '音楽', comedy: 'お笑い', koyake: 'こやけ' };
 openM('<h3>サイト設定 (' + (genreNames[currentGenre] || '全般') + ')</h3>'
 +'<label>ヘッダー画像（タップして写真を選択）</label><input id="sfile" type="file" accept="image/*">'
 +'<button class="btn p" onclick="saveSite()">保存する</button><button class="btn" onclick="closeM()">キャンセル</button>');
}
async function saveSite(){
 const site=getActiveSite();
 let header_url=site.header_url||null;
 const fileInput=$('#sfile');
 if(fileInput.files&&fileInput.files[0]){
  toast('画像を圧縮してアップロード中...');
  try{
   const blob=await resizeImgForHeader(fileInput.files[0]);
   const path='header_'+currentGenre+'.jpg';
   const up=await sb.storage.from('avatars').upload(path,blob,{contentType:'image/jpeg',upsert:true});
   if(up.error)return toast('画像失敗: '+up.error.message);
   const pubUrlObj=sb.storage.from('avatars').getPublicUrl(path);
   header_url=pubUrlObj.data.publicUrl+'?v='+Date.now();
  }catch(err){return toast('画像処理に失敗しました')}
 }
 const r=await sb.from('site_settings').upsert({
  genre: currentGenre,
  title: '',
  header_url: header_url
 }, {onConflict: 'genre'});
 if(r.error)return toast('失敗: '+r.error.message);
 closeM();toast('保存しました');load();
}

function resizeImgForHeader(file){
 return new Promise((res,rej)=>{
  const img=new Image(),reader=new FileReader();
  reader.onload=e=>img.src=e.target.result;
  reader.onerror=rej;
  img.onload=()=>{
   const canvas=document.createElement('canvas');
   let w=img.width,h=img.height,max=1200;
   if(w>h){if(w>max){h=Math.round(h*max/w);w=max}}else{if(h>max){w=Math.round(w*max/h);h=max}}
   canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext('2d');
   ctx.drawImage(img,0,0,w,h);
   canvas.toBlob(b=>res(b),'image/jpeg',0.9);
  };
  reader.readAsDataURL(file);
 });
}

sb.auth.onAuthStateChange((ev,s)=>{
 if(s&&s.user){me=s.user;setTimeout(load,0)}else{me=null;authView()}
});
